<style>
  body { background: #0F0A0A; color: #fff; font-family: 'Inter', sans-serif; }
  .orb-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.35; mix-blend-mode: screen; }
  .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #FF4F00 0%, transparent 70%); top: -150px; right: -100px; animation: o1 30s infinite ease-in-out; }
  .orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, #BF00FF 0%, transparent 70%); bottom: -200px; left: -100px; animation: o2 35s infinite ease-in-out; }
  @keyframes o1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,40px)} }
  @keyframes o2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-30px)} }

  .glass { background: rgba(255,255,255,0.035); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.25rem; }
  .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 10px; color: rgba(255,255,255,0.5); font-size: 14px; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .nav-link.active { color: #fff; background: rgba(255,79,0,0.15); border-left: 3px solid #FF4F00; }
  .badge { display: inline-flex; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge-orange { background: rgba(255,79,0,0.15); color: #FF4F00; }
  .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
  .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge-purple { background: rgba(168,85,247,0.15); color: #c084fc; }
  .badge-yellow { background: rgba(234,179,8,0.15); color: #facc15; }
  .badge-gray { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 16px; border-radius: 10px; font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-orange { background: #FF4F00; color: #fff; } .btn-orange:hover { background: #e04500; }
  .btn-ghost { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.08); } .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; } .btn-danger:hover { background: rgba(239,68,68,0.25); }
  .btn-success { background: rgba(34,197,94,0.15); color: #4ade80; } .btn-success:hover { background: rgba(34,197,94,0.25); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }

  .input { width: 100%; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-size: 13px; background: rgba(255,255,255,0.03); color: #fff; outline: none; }
  .input:focus { border-color: #FF4F00; box-shadow: 0 0 0 2px rgba(255,79,0,0.15); }
  .input::placeholder { color: rgba(255,255,255,0.25); }
  textarea.input { resize: vertical; min-height: 80px; }
  select.input { appearance: auto; } select.input option { background: #0F0A0A; }

  .card-hover { transition: all 0.2s; } .card-hover:hover { border-color: rgba(255,79,0,0.3); transform: translateY(-1px); }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 500; animation: toastIn 0.3s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* Role-based visibility — default: both hidden (guest) */
  .nav-client-only { display: none !important; }
  .nav-performer-only { display: none !important; }
  body[data-user-role="client"] .nav-client-only { display: flex !important; }
  body[data-user-role="performer"] .nav-performer-only { display: flex !important; }
  body[data-user-role="admin"] .nav-client-only,
  body[data-user-role="admin"] .nav-performer-only { display: flex !important; }

  @media (max-width: 768px) { .sidebar-open #sidebar { transform: translateX(0); } }
</style>

    <a href="#/performers" class="nav-link flex-col gap-0.5 text-[10px] py-1 px-3" data-page="performers"><i class="ti ti-users text-lg"></i><span>Люди</span></a>
    <a href="#/my-tasks" class="nav-link nav-client-only flex-col gap-0.5 text-[10px] py-1 px-3" data-page="my-tasks"><i class="ti ti-list-check text-lg"></i><span>Мои задачи</span></a>

<div id="toasts"></div>

<script>
const API = '/api';
let token = localStorage.getItem('tb_token');
let user = JSON.parse(localStorage.getItem('tb_user') || 'null');
let currentPage = 'catalog';

// ─── Auth ─────────────────────────────────────────────────
function showLoginModal() { closeLoginFormErrors(); showLoginForm(); document.getElementById('login-modal').classList.remove('hidden'); }
function showRegisterModal() { closeLoginFormErrors(); showRegisterForm(); document.getElementById('login-modal').classList.remove('hidden'); }
function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
function requireAuth() { if (!token) { showLoginModal(); return false; } return true; }
function closeLoginFormErrors() {
  document.getElementById('login-error').classList.add('hidden');
  document.getElementById('reg-error').classList.add('hidden');
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  try {
    const r = await fetch(API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Ошибка входа');
    token = d.token; user = d.user;
    localStorage.setItem('tb_token', token);
    localStorage.setItem('tb_user', JSON.stringify(user));
    closeLoginModal();
    updateNav();
    route();
  } catch(err) {
    const el = document.getElementById('login-error');
    el.textContent = err.message; el.classList.remove('hidden');
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-pass').value;
  const role = document.getElementById('reg-role').value;
  try {
    const r = await fetch(API + '/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password, role }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Ошибка регистрации');
    token = d.token; user = d.user;
    localStorage.setItem('tb_token', token);
    localStorage.setItem('tb_user', JSON.stringify(user));
    closeLoginModal();
    updateNav();
    route();
  } catch(err) {
    const el = document.getElementById('reg-error');
    el.textContent = err.message; el.classList.remove('hidden');
  }
}

function showLoginForm() {
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('register-form').classList.add('hidden');
  document.getElementById('login-tab-btn').className = 'btn btn-orange';
  document.getElementById('register-tab-btn').className = 'btn btn-ghost';
}

function showRegisterForm() {
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('register-form').classList.remove('hidden');
  document.getElementById('login-tab-btn').className = 'btn btn-ghost';
  document.getElementById('register-tab-btn').className = 'btn btn-orange';
}

function showRegisterWithRole(role) {
  showRegisterModal();
  const sel = document.getElementById('reg-role');
  if (sel) sel.value = role;
}

function showRegisterWithRole(role) {
  showRegisterModal();
  const sel = document.getElementById('reg-role');
  if (sel) sel.value = role;
}

function updateNav() {
  const guest = document.getElementById('guest-nav');
  const userNav = document.getElementById('user-nav');
  const notifBtn = document.getElementById('notif-btn');
  const clientOnly = document.querySelectorAll('.nav-client-only');
  const performerOnly = document.querySelectorAll('.nav-performer-only');
  if (token && user) {
    guest.classList.add('hidden');
    userNav.classList.remove('hidden');
    notifBtn.classList.remove('hidden');
    document.getElementById('user-name-nav').textContent = user.name;
    const av = document.getElementById('user-avatar');
    av.src = user.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(user.name)}&backgroundColor=FF4F00`;
    // Set user role on body for CSS
    document.body.setAttribute('data-user-role', user.role || 'client');
    clientOnly.forEach(el => el.classList.toggle('hidden', user.role !== 'client'));
    performerOnly.forEach(el => el.classList.toggle('hidden', user.role !== 'performer'));
  } else {
    guest.classList.remove('hidden');
    userNav.classList.add('hidden');
    notifBtn.classList.add('hidden');
    document.body.removeAttribute('data-user-role');
    clientOnly.forEach(el => el.classList.add('hidden'));
    performerOnly.forEach(el => el.classList.add('hidden'));
  }
}

function logout() {
  token = null; user = null;
  localStorage.removeItem('tb_token');
  localStorage.removeItem('tb_user');
  closeUserMenu();
  updateNav();
  route();
}

function showApp() {
  updateNav();
  route();
}

function toggleUserMenu() {
  document.getElementById('user-menu').classList.toggle('hidden');
}

function closeUserMenu() {
  document.getElementById('user-menu').classList.add('hidden');
}

function toggleSidebar() {
  document.body.classList.toggle('sidebar-open');
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body === 'string') { /* keep */ }
  const r = await fetch(API + path, { ...opts, headers });
  if (r.status === 401) {
    if (token) { logout(); throw new Error('Сессия истекла'); }
    throw new Error('Требуется авторизация');
  }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
  return d;
}

// ─── Routing ──────────────────────────────────────────────
function navigate(hash) {
  location.hash = hash;
}

function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/');
  const page = parts[0] || 'home';
  currentPage = page;

  document.querySelectorAll('.nav-link').forEach(l => {
    const dp = l.dataset.page;
    l.classList.toggle('active', dp === page || (dp === 'catalog' && ['catalog','tasks'].includes(page)) || (dp === 'my-tasks' && page === 'my-tasks'));
  });

  const pc = document.getElementById('page-content');
  pc.innerHTML = '<div class="space-y-4">' + Array(3).fill('<div class="skeleton" style="height:40px"></div>').join('') + '</div>';
  pc.className = 'p-4 lg:p-6 pb-20 lg:pb-6 max-w-6xl mx-auto fade-in';
  pc.style.minHeight = '';

  document.body.style.overflow = (page === 'home') ? 'hidden' : 'auto';
  document.body.style.display = '';
  document.body.style.flexDirection = '';
  document.body.style.height = '';

  function authGuard() {
    if (!token) {
      pc.innerHTML = `<div class="glass p-12 text-center">
        <i class="ti ti-lock text-5xl text-white/20 block mb-4"></i>
        <p class="text-white/40 mb-3">Требуется авторизация</p>
        <button onclick="showLoginModal()" class="btn btn-orange">Войти</button>
      </div>`;
      return false;
    }
    return true;
  }

  const handlers = {
    'home': renderCatalog,
    'catalog': renderTasks,
    'performers': renderPerformers,
    'tasks': () => parts[1] ? renderTaskDetail(pc, parts[1]) : renderTasks(),
    'my-tasks': () => {
      if (!authGuard()) return;
      if (user?.role === 'performer') {
        pc.innerHTML = `<div class="glass p-12 text-center">
          <i class="ti ti-lock text-5xl text-white/20 block mb-4"></i>
          <p class="text-white/40">Эта страница доступна только заказчикам</p>
        </div>`;
        return;
      }
      renderMyTasks(pc);
    },
    'my-offers': () => {
      if (!authGuard()) return;
      if (user?.role === 'client') {
        pc.innerHTML = `<div class="glass p-12 text-center">
          <i class="ti ti-lock text-5xl text-white/20 block mb-4"></i>
          <p class="text-white/40">Эта страница доступна только исполнителям</p>
        </div>`;
        return;
      }
      renderMyOffers(pc);
    },
    'create': () => authGuard() && renderCreateTask(pc),
    'profile': () => parts[1] ? renderUserProfile(pc, parts[1]) : (authGuard() && renderMyProfile(pc)),
    'notifications': () => authGuard() && renderNotifications(pc),
    'settings': () => authGuard() && renderSettings(pc)
  };

  updateNotifBadge();
  if (handlers[page]) handlers[page]();
  else pc.innerHTML = '<div class="glass p-10 text-center"><p class="text-white/40">Страница не найдена</p></div>';
}

async function updateNotifBadge() {
  try {

    const d = await api('/notifications/unseen-count');

  } catch {}
}

function esc(s) { if (s==null) return ''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n) { return n ? Number(n).toLocaleString('ru-RU') + ' ₽' : 'Договорная'; }
function toast(msg, type='info') {
  const colors = { info: 'bg-blue-600', success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-yellow-600' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]||colors.info} text-white`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function handleCreateTask(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Публикация...';
  try {
    const skills = document.getElementById('task-skills').value.split(',').map(s=>s.trim()).filter(Boolean);
    await api('/tasks', {
      method: 'POST',
      body: JSON.stringify({
        title: document.getElementById('task-title').value,
        description: document.getElementById('task-desc').value,
        expected_result: document.getElementById('task-result').value,
        category: document.getElementById('task-category').value,
        budget: parseFloat(document.getElementById('task-budget').value) || 0,
        budget_type: document.getElementById('task-budget-type').value,
        deadline: document.getElementById('task-deadline').value,
        urgency: document.getElementById('task-urgency').value,
        remote_allowed: document.getElementById('task-remote').checked ? 1 : 0,
        required_skills: skills,
        status: 'published'
      })
    });
    toast('Задача опубликована!', 'success');
    navigate('/my-tasks');
  } catch(err) {
    const el = document.getElementById('create-task-error');
    el.textContent = err.message; el.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Опубликовать';
  }
}

        <a href="#" onclick="history.back();return false" class="text-white/40 hover:text-white text-sm"><i class="ti ti-arrow-left"></i> Назад</a>
      </div>

        <div class="flex flex-wrap items-center gap-2 mb-3">

              </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="p-3 bg-white/[0.03] rounded-xl border border-white/[0.05]">

                <p class="font-medium text-sm">${fmtDate(task.created_at)}</p>
              </div>
            </div>

            <div>
              <h3 class="text-sm font-semibold text-white/50 uppercase tracking-wider mb-2">Описание</h3>
              <p class="text-white/80 whitespace-pre-wrap">${esc(task.description)}</p>
            </div>

            ${task.required_skills?.length ? `
              <div>
                <h3 class="text-sm font-semibold text-white/50 uppercase tracking-wider mb-2">Навыки</h3>
                <div class="flex flex-wrap gap-2">
                  ${task.required_skills.map(s => `<span class="badge badge-gray">${esc(s)}</span>`).join('')}
                </div>
              </div>
            ` : ''}

          <div class="space-y-4">
            ${task.expected_result ? `
              <div class="p-4 bg-white/[0.03] rounded-xl border border-white/[0.05]">

                <a href="#/profile/${task.assigned_to}" class="text-brand font-medium hover:underline">${esc(task.assigned_user.name)}</a>
              </div>
            ` : ''}

            ${isCreator ? `<div class="p-4 bg-white/[0.03] rounded-xl border border-white/[0.05]">
              <h3 class="text-sm font-semibold text-white/50 uppercase tracking-wider mb-2">Действия</h3>
              ${renderTaskActions(task)}

      ${canChat && activeStatuses.includes(task.status) ? renderChatBlock(task) : ''}

function renderTaskActions(task) {
  const btns = [];
  if (task.status === 'published') btns.push(`<button onclick="updateStatus(${task.id},'moderation')" class="btn btn-ghost btn-sm">Отправить на модерацию</button>`);
  if (task.status === 'moderation') btns.push(`<button onclick="updateStatus(${task.id},'published')" class="btn btn-success btn-sm">Опубликовать</button>`);
  if (task.status === 'assigned') btns.push(`<button onclick="updateStatus(${task.id},'in_progress')" class="btn btn-orange btn-sm">Начать работу</button>`);
  if (task.status === 'in_progress') btns.push(`<button onclick="updateStatus(${task.id},'completed')" class="btn btn-success btn-sm">Завершить</button>`);
  if (['assigned','in_progress','review'].includes(task.status)) btns.push(`<button onclick="updateStatusToDisputed(${task.id})" class="btn btn-danger btn-sm">Открыть спор</button>`);

  return btns.length ? `<div class="flex flex-wrap gap-2">${btns.join('')}</div>` : '';
}

async function updateStatus(id, status) {
  try {
    await api(`/tasks/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
    toast('Статус обновлён', 'success');
    navigate('/tasks/' + id);
  } catch(e) { toast(e.message, 'error'); }
}

async function updateStatusToDisputed(id) {
  if (!confirm('Открыть спор по этой задаче?')) return;
  await updateStatus(id, 'disputed');
}

async function choosePerformer(taskId, offerId) {

    await api(`/tasks/${taskId}/choose`, { method: 'PUT', body: JSON.stringify({ offer_id: offerId }) });
    toast('Исполнитель выбран!', 'success');
    navigate('/tasks/' + taskId);
  } catch(e) { toast(e.message, 'error'); }
}

async function rejectOffer(taskId, offerId) {
  if (!confirm('Отклонить этот отклик?')) return;
  try {
    await api(`/tasks/${taskId}/offers/reject`, { method: 'PUT', body: JSON.stringify({ offer_id: offerId }) });
    toast('Отклик отклонён', 'success');
    navigate('/tasks/' + taskId);
  } catch(e) { toast(e.message, 'error'); }
}

async function handleSendOffer(e, taskId) {

// ─── CHAT ─────────────────────────────────────────────────
function renderChatBlock(task) {
  return `
    <div class="glass p-5 mt-4">
      <h3 class="font-jakarta font-bold mb-4">Чат</h3>
      <div id="chat-messages" class="space-y-3 mb-4 max-h-[400px] overflow-y-auto"></div>
      <form onsubmit="handleSendMessage(event, ${task.id})" class="flex gap-2">
        <input type="text" id="chat-input" class="input" placeholder="Введите сообщение..." required>
        <button type="submit" class="btn btn-orange"><i class="ti ti-send"></i></button>
      </form>
    </div>
  `;
}

async function loadChat(taskId) {
  try {
    const d = await api('/chat/' + taskId);
    const container = document.getElementById('chat-messages');
    if (!container) return;
    container.innerHTML = d.messages.map(m => `
      <div class="flex ${m.sender_id === user?.id ? 'justify-end' : 'justify-start'}">
        <div class="max-w-[80%] ${m.sender_id === user?.id ? 'bg-brand/20 border-brand/30' : 'bg-white/[0.05] border-white/[0.08]'} p-3 rounded-xl border">
          <p class="text-xs text-white/40 mb-1">${esc(m.sender_name||'')}</p>
          <p class="text-sm">${esc(m.content)}</p>
          <p class="text-xs text-white/20 mt-1">${fmtDate(m.created_at)}</p>
        </div>
      </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
  } catch(e) { toast('Ошибка загрузки чата: ' + e.message, 'error'); }
}

async function handleSendMessage(e, taskId) {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const content = input.value;
  input.value = '';
  try {
    await api('/chat/' + taskId, { method: 'POST', body: JSON.stringify({ content }) });
    loadChat(taskId);
  } catch(err) { toast(err.message, 'error'); input.value = content; }
}

// ─── REVIEWS ──────────────────────────────────────────────
function renderReviewsBlock(task) {
  return `
    <div class="glass p-5 mt-4">
      <h3 class="font-jakarta font-bold mb-4">Оставить отзыв</h3>
      <form onsubmit="handleReview(event, ${task.id})" class="space-y-4 max-w-xl">
        <div>
          <label class="block text-xs font-semibold text-white/50 mb-2">Оценка</label>
          <div class="flex gap-2 text-2xl" id="star-rating">
            ${[1,2,3,4,5].map(i => `<span onclick="setRating(${i})" class="cursor-pointer transition-colors hover:text-yellow-400 text-white/20" data-star="${i}">★</span>`).join('')}
          </div>
          <input type="hidden" id="review-rating" value="5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-white/50 mb-1">Комментарий</label>
          <textarea id="review-comment" class="input" rows="3"></textarea>
        </div>
        <div id="review-error" class="text-red-400 text-sm hidden"></div>
        <button type="submit" class="btn btn-orange">Отправить отзыв</button>
      </form>
    </div>
  `;
}

function setRating(n) {
  document.getElementById('review-rating').value = n;
  document.querySelectorAll('#star-rating span').forEach(s => {
    s.style.color = parseInt(s.dataset.star) <= n ? '#facc15' : 'rgba(255,255,255,0.2)';
  });
}

async function handleReview(e, taskId) {
  e.preventDefault();
  try {
    await api('/reviews', {
      method: 'POST',
      body: JSON.stringify({
        task_id: taskId,
        rating: parseInt(document.getElementById('review-rating').value),
        comment: document.getElementById('review-comment').value
      })
    });
    toast('Отзыв оставлен!', 'success');
    navigate('/tasks/' + taskId);
  } catch(err) {
    const el = document.getElementById('review-error');
    el.textContent = err.message; el.classList.remove('hidden');
  }

async function renderNotifications(el) {
  try {
    const d = await api('/notifications');
    const notifs = d.notifications || [];

    el.innerHTML = `
      <div class="flex items-center justify-between mb-6">
        <h1 class="font-jakarta text-xl font-bold">Уведомления</h1>
        ${notifs.some(n => !n.seen) ? `<button onclick="markAllSeen()" class="btn btn-ghost btn-sm"><i class="ti ti-check-all"></i>Все прочитаны</button>` : ''}
      </div>
      ${notifs.length === 0 ? `
        <div class="glass p-12 text-center">
          <i class="ti ti-bell-off text-5xl text-white/20 block mb-4"></i>
          <p class="text-white/40">Нет уведомлений</p>
        </div>
      ` : `
        <div class="space-y-2">
          ${notifs.map(n => `
            <div class="glass p-4 flex items-start gap-3 ${n.seen ? 'opacity-50' : 'border-l-4 border-brand'}" onclick="markSeen(${n.id})">
              <div class="flex-1">
                <p class="text-sm ${n.seen ? '' : 'font-medium'}">${esc(n.type)}</p>
                <p class="text-xs text-white/40 mt-1">${fmtDate(n.created_at)}</p>
              </div>
              ${!n.seen ? '<i class="ti ti-circle-filled text-brand text-xs mt-1"></i>' : ''}
            </div>
          `).join('')}
        </div>
      `}
    `;
  } catch(e) { el.innerHTML = `<p class="text-red-400">${esc(e.message)}</p>`; }
}

async function markSeen(id) {
  try { await api('/notifications/' + id + '/seen', { method: 'PATCH' }); updateNotifBadge(); } catch {}
}

async function markAllSeen() {
  try { await api('/notifications/seen-all', { method: 'PATCH' }); toast('Все прочитаны', 'success'); navigate('/notifications'); } catch(e) { toast(e.message, 'error'); }
}

      </form>
    `;
  } catch(e) { el.innerHTML = `<p class="text-red-400">${esc(e.message)}</p>`; }
}

async function handleUpdateProfile(e) {
  e.preventDefault();
  try {
    const skills = document.getElementById('prof-skills')?.value.split(',').map(s=>s.trim()).filter(Boolean) || [];
    const portfolio_links = document.getElementById('prof-portfolio')?.value.split(',').map(s=>s.trim()).filter(Boolean) || [];
    const languages = document.getElementById('prof-languages')?.value.split(',').map(s=>s.trim()).filter(Boolean) || [];
    await api('/users/profile', {
      method: 'PUT',
      body: JSON.stringify({
        name: document.getElementById('prof-name').value,
        company: document.getElementById('prof-company')?.value,
        city: document.getElementById('prof-city').value,
        country: document.getElementById('prof-country').value,
        bio: document.getElementById('prof-bio').value,
        website: document.getElementById('prof-website').value,
        contact: document.getElementById('prof-contact').value,
        specialization: document.getElementById('prof-spec')?.value,
        skills,
        experience: document.getElementById('prof-exp')?.value,
        portfolio_links,
        languages,
        hourly_rate: parseFloat(document.getElementById('prof-rate')?.value) || 0,
        availability: document.getElementById('prof-avail')?.value
      })
    });
    toast('Профиль обновлён', 'success');
    route();
  } catch(err) {
    const el = document.getElementById('profile-error');
    el.textContent = err.message; el.classList.remove('hidden');
  }
}

async function handleChangePass() {
  const current = document.getElementById('pass-current').value;
  const newPass = document.getElementById('pass-new').value;
  if (!current || !newPass) { toast('Заполните оба поля', 'warning'); return; }
  try {
    await api('/users/password', { method: 'PUT', body: JSON.stringify({ currentPassword: current, newPassword: newPass }) });
    toast('Пароль изменён', 'success');
    document.getElementById('pass-current').value = '';
    document.getElementById('pass-new').value = '';
  } catch(e) { toast(e.message, 'error'); }
}

// ─── INIT ─────────────────────────────────────────────────
showApp();
</script>
