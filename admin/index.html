<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskBridge — Центр управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'], jakarta: ['"Plus Jakarta Sans"','sans-serif'] },
    colors: { brand: '#FF4F00', magenta: '#BF00FF', page: '#1A1110' }
  }}
};
</script>
<style>
  body { background: #1A1110; color: #fff; font-family: 'Inter', sans-serif; }
  .orb-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4; mix-blend-mode: screen; }
  .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #FF4F00 0%, transparent 70%); top: -150px; right: -100px; animation: o1 30s infinite ease-in-out; }
  .orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, #BF00FF 0%, transparent 70%); bottom: -200px; left: -100px; animation: o2 35s infinite ease-in-out; }
  @keyframes o1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,40px)} }
  @keyframes o2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-30px)} }

  .glass { background: rgba(255,255,255,0.035); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.25rem; }
  .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem; }
  .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 12px; color: rgba(255,255,255,0.5); font-size: 14px; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; }
  .sidebar-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .sidebar-link.active { color: #fff; background: rgba(255,79,0,0.15); border-left: 3px solid #FF4F00; }
  .sidebar-link i { font-size: 20px; width: 24px; text-align: center; }
  .badge { display: inline-flex; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge-orange { background: rgba(255,79,0,0.15); color: #FF4F00; }
  .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
  .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge-purple { background: rgba(168,85,247,0.15); color: #c084fc; }
  .badge-yellow { background: rgba(234,179,8,0.15); color: #facc15; }
  .badge-gray { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 16px; border-radius: 10px; font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-orange { background: #FF4F00; color: #fff; } .btn-orange:hover { background: #e04500; }
  .btn-ghost { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.08); } .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; } .btn-danger:hover { background: rgba(239,68,68,0.25); }
  .btn-success { background: rgba(34,197,94,0.15); color: #4ade80; } .btn-success:hover { background: rgba(34,197,94,0.25); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }

  .input { width: 100%; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-size: 13px; background: rgba(255,255,255,0.03); color: #fff; outline: none; }
  .input:focus { border-color: #FF4F00; box-shadow: 0 0 0 2px rgba(255,79,0,0.15); }
  .input::placeholder { color: rgba(255,255,255,0.25); }
  select.input { appearance: auto; } select.input option { background: #1A1110; }

  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  th { text-align: left; padding: 10px 14px; color: rgba(255,255,255,0.4); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.06); }
  td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .stat-num { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 2rem; line-height: 1; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 500; animation: toastIn 0.3s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; height: 20px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body class="min-h-screen">
<div class="orb-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<!-- Login Screen -->
<div id="login-screen" class="relative z-10 min-h-screen flex items-center justify-center p-4">
  <div class="glass p-10 w-full max-w-md text-center">
    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-12 shadow-xl shadow-white/10">
      <i class="ti ti-bridge text-[#1A1110] text-3xl"></i>
    </div>
    <h1 class="font-jakarta text-2xl font-extrabold mb-1">TaskBridge</h1>
    <p class="text-white/40 text-sm mb-8">Центр управления платформой</p>
    <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <div><label class="block text-xs font-semibold text-white/50 mb-1 uppercase tracking-wider">Email</label>
        <input type="email" id="login-email" class="input" value="admin@taskbridge.local" required></div>
      <div><label class="block text-xs font-semibold text-white/50 mb-1 uppercase tracking-wider">Пароль</label>
        <input type="password" id="login-pass" class="input" placeholder="Введите пароль" required></div>
      <div id="login-error" class="text-red-400 text-sm hidden"></div>
      <button type="submit" class="btn btn-orange w-full py-3 text-base">Войти</button>
    </form>
  </div>
</div>

<!-- Main App -->
<div id="app-shell" class="relative z-10 hidden min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="w-64 min-h-screen bg-[#1A1110]/80 backdrop-blur-xl border-r border-white/[0.06] flex flex-col fixed left-0 top-0 bottom-0 z-50">
      <div class="p-5 border-b border-white/[0.06]">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center rotate-12 shadow-lg shadow-white/10">
            <i class="ti ti-bridge text-[#1A1110] text-lg"></i>
          </div>
          <div><div class="font-jakarta font-extrabold text-sm tracking-tight">TaskBridge</div><div class="text-[10px] text-white/30 uppercase tracking-widest">Админ-панель</div></div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto py-3 px-3 space-y-1">
        <a href="#dashboard" class="sidebar-link" data-page="dashboard"><i class="ti ti-layout-dashboard"></i>Дашборд</a>
        <a href="#moderation" class="sidebar-link" data-page="moderation"><i class="ti ti-shield-check"></i>Модерация<span id="nav-mod-badge" class="ml-auto badge badge-yellow hidden"></span></a>
        <a href="#disputes" class="sidebar-link" data-page="disputes"><i class="ti ti-scale"></i>Споры<span id="nav-disp-badge" class="ml-auto badge badge-red hidden"></span></a>
        <a href="#tasks" class="sidebar-link" data-page="tasks"><i class="ti ti-list-check"></i>Все задачи</a>
        <a href="#users" class="sidebar-link" data-page="users"><i class="ti ti-users"></i>Пользователи</a>
        <a href="#offers" class="sidebar-link" data-page="offers"><i class="ti ti-file-certificate"></i>Отклики</a>
        <a href="#reports" class="sidebar-link" data-page="reports"><i class="ti ti-alert-triangle"></i>Жалобы<span id="nav-reports-badge" class="ml-auto badge badge-red hidden"></span></a>
        <a href="#reviews" class="sidebar-link" data-page="reviews"><i class="ti ti-star"></i>Отзывы</a>
        <a href="#chats" class="sidebar-link" data-page="chats"><i class="ti ti-messages"></i>Чаты</a>
        <a href="#notifications" class="sidebar-link" data-page="notifications"><i class="ti ti-bell"></i>Рассылки</a>
        <a href="#actions" class="sidebar-link" data-page="actions"><i class="ti ti-history"></i>Журнал</a>
      </div>
      <div class="p-4 border-t border-white/[0.06] text-[11px] text-white/20">v2.0.0</div>
    </nav>

    <!-- Content -->
    <div class="flex-1 ml-64">
      <!-- Top Bar -->
      <header class="sticky top-0 z-40 bg-[#1A1110]/60 backdrop-blur-xl border-b border-white/[0.06] px-6 py-3 flex items-center justify-between">
        <h2 id="page-title" class="font-jakarta text-lg font-bold"></h2>
        <div class="flex items-center gap-4">
          <span id="admin-name" class="text-sm text-white/50"></span>
          <button onclick="logout()" class="btn btn-ghost btn-sm"><i class="ti ti-logout"></i>Выйти</button>
        </div>
      </header>
      <main id="page-content" class="p-6"></main>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const API = '/api/admin';
let token = localStorage.getItem('tb_admin_token');
let admin = JSON.parse(localStorage.getItem('tb_admin') || 'null');
let currentPage = 'dashboard';

// ─── Auth ─────────────────────────────────────────────────
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  try {
    const r = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Ошибка входа');
    token = d.token; admin = d.admin;
    localStorage.setItem('tb_admin_token', token);
    localStorage.setItem('tb_admin', JSON.stringify(admin));
    showApp();
  } catch(err) {
    const el = document.getElementById('login-error');
    el.textContent = err.message; el.classList.remove('hidden');
  }
}

function logout() {
  token = null; admin = null;
  localStorage.removeItem('tb_admin_token');
  localStorage.removeItem('tb_admin');
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('admin-name').textContent = admin?.name || 'Админ';
  route();
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  if (opts.body && typeof opts.body === 'string') { /* keep */ }
  const r = await fetch(API + path, { ...opts, headers });
  if (r.status === 401) { logout(); throw new Error('Сессия истекла'); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
  return d;
}

// ─── Routing ──────────────────────────────────────────────
const TITLES = { dashboard:'Дашборд', moderation:'Модерация задач', disputes:'Споры', tasks:'Все задачи', users:'Пользователи', offers:'Отклики', reports:'Жалобы', reviews:'Отзывы', chats:'Чаты', notifications:'Рассылки', actions:'Журнал действий' };

function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [page, param] = hash.split('/');
  currentPage = page;
  document.getElementById('page-title').textContent = TITLES[page] || page;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.toggle('active', l.dataset.page === page));
  const pc = document.getElementById('page-content');
  pc.innerHTML = '<div class="space-y-4">' + Array(5).fill('<div class="skeleton" style="height:40px"></div>').join('') + '</div>';
  pc.className = 'p-6 fade-in';

  const handlers = { dashboard: renderDashboard, moderation: renderModeration, disputes: renderDisputes, tasks: renderTasks, users: renderUsers, offers: renderOffers, reports: renderReports, reviews: renderReviews, chats: () => param ? renderChatDetail(pc, param) : renderChats(pc), notifications: renderNotifications, actions: renderActions };
  if (handlers[page]) handlers[page](pc);
  else pc.innerHTML = '<p class="text-white/40">Страница не найдена</p>';
}
window.addEventListener('hashchange', route);

// ─── Helpers ──────────────────────────────────────────────
function esc(s) { if (s==null) return ''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function fmtDate(d) { if (!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n) { return n ? n.toLocaleString('ru-RU') + ' ₽' : '—'; }
function toast(msg, type='info') {
  const colors = { info: 'bg-blue-600', success: 'bg-green-600', error: 'bg-red-600' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]||colors.info} text-white`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
async function confirmAction(msg, action) {
  if (!confirm(msg)) return;
  try { await action(); toast('Готово', 'success'); route(); } catch(e) { toast(e.message, 'error'); }
}
const STATUS_LABELS = { draft:'Черновик', published:'Опубликована', moderation:'Модерация', hidden:'Скрыта', assigned:'Исполнитель выбран', in_progress:'В работе', review:'На проверке', completed:'Завершена', cancelled:'Отменена', disputed:'Спорная', archived:'Архив' };
const STATUS_BADGE = { draft:'badge-gray', published:'badge-green', moderation:'badge-yellow', hidden:'badge-red', assigned:'badge-blue', in_progress:'badge-purple', review:'badge-yellow', completed:'badge-green', cancelled:'badge-gray', disputed:'badge-red', archived:'badge-gray' };
const ROLE_LABELS = { client:'Заказчик', performer:'Исполнитель', admin:'Админ' };
const ROLE_BADGE = { client:'badge-blue', performer:'badge-purple', admin:'badge-orange' };
const CAT_LABELS = { sites:'Сайты', design:'Дизайн', ads:'Реклама', bots:'Боты', automation:'Автоматизация', texts:'Тексты', presentations:'Презентации', analytics:'Аналитика', other:'Другое' };

function statusBadge(s) { return `<span class="badge ${STATUS_BADGE[s]||'badge-gray'}">${STATUS_LABELS[s]||s}</span>`; }
function roleBadge(r) { return `<span class="badge ${ROLE_BADGE[r]||'badge-gray'}">${ROLE_LABELS[r]||r}</span>`; }

// ─── DASHBOARD ────────────────────────────────────────────
async function renderDashboard(el) {
  try {
    const d = await api('/stats');
    const modItem = (d.tasksByStatus || []).find(s => s.status === 'moderation');
    const pendingTasks = modItem ? modItem.count : 0;
    const dispItem = (d.tasksByStatus || []).find(s => s.status === 'disputed');
    const disputedTasks = dispItem ? dispItem.count : 0;
    const openReports = d.totalReports || 0;

    // Update nav badges
    const tb = document.getElementById('nav-tasks-badge');
    if (tb) { if (pendingTasks > 0) { tb.textContent = pendingTasks; tb.classList.remove('hidden'); } else { tb.classList.add('hidden'); } }
    const rb = document.getElementById('nav-reports-badge');
    if (rb) { if (openReports > 0) { rb.textContent = openReports; rb.classList.remove('hidden'); } else { rb.classList.add('hidden'); } }
    const mb = document.getElementById('nav-mod-badge');
    if (mb) { if (pendingTasks > 0) { mb.textContent = pendingTasks; mb.classList.remove('hidden'); } else { mb.classList.add('hidden'); } }
    const db2 = document.getElementById('nav-disp-badge');
    if (db2) { if (disputedTasks > 0) { db2.textContent = disputedTasks; db2.classList.remove('hidden'); } else { db2.classList.add('hidden'); } }

    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('ti-users','Пользователи', d.totalUsers, '#3B82F6')}
        ${statCard('ti-list-check','Задачи', d.totalTasks, '#FF4F00')}
        ${statCard('ti-file-certificate','Отклики', d.totalOffers, '#BF00FF')}
        ${statCard('ti-star','Отзывы', d.totalReviews, '#22C55E')}
        ${statCard('ti-check','Завершено', d.completedTasks, '#10B981')}
        ${statCard('ti-alert-triangle','Жалобы', d.totalReports || 0, '#EF4444')}
        ${statCard('ti-currency-rub','Оборот', fmtMoney(d.totalBudget || 0), '#F59E0B')}
        ${statCard('ti-user-plus','Новых (неделя)', d.newUsersWeek || 0, '#8B5CF6')}
      </div>

      <div class="grid lg:grid-cols-3 gap-6 mb-6">
        <!-- Tasks by Status -->
        <div class="glass p-5">
          <h3 class="font-jakarta font-bold mb-4 flex items-center gap-2"><i class="ti ti-chart-bar text-[#FF4F00]"></i>Задачи по статусам</h3>
          <div class="space-y-3">
            ${(d.tasksByStatus || []).map(item => `
              <div class="flex items-center gap-3">
                <span class="text-xs text-white/50 w-24 truncate">${STATUS_LABELS[item.status]||item.status}</span>
                <div class="flex-1 h-5 bg-white/[0.04] rounded-full overflow-hidden">
                  <div class="h-full rounded-full" style="width:${Math.min(100, item.count/d.totalTasks*100)}%; background:${item.status==='completed'?'#22C55E':item.status==='cancelled'?'#6B7280':'#FF4F00'}"></div>
                </div>
                <span class="text-sm font-bold w-8 text-right">${item.count}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="glass p-5">
          <h3 class="font-jakarta font-bold mb-4 flex items-center gap-2"><i class="ti ti-activity text-[#BF00FF]"></i>Последние действия</h3>
          <div class="space-y-2 max-h-[280px] overflow-y-auto">
            ${(d.recentActions || []).slice(0,10).map(a => `
              <div class="flex items-start gap-3 py-2 border-b border-white/[0.04] last:border-0">
                <div class="w-8 h-8 rounded-lg bg-[#FF4F00]/10 flex items-center justify-center flex-shrink-0 mt-0.5">
                  <i class="ti ti-settings text-[#FF4F00] text-sm"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm truncate"><strong>${esc(a.action)}</strong> <span class="text-white/40">${esc(a.details||'')}</span></p>
                  <p class="text-xs text-white/25">${fmtDate(a.created_at)}</p>
                </div>
              </div>
            `).join('') || '<p class="text-white/30 text-sm">Нет действий</p>'}
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="space-y-4">
          <div class="glass p-5">
            <h3 class="font-jakarta font-bold mb-4 flex items-center gap-2"><i class="ti ti-bolt text-[#F59E0B]"></i>Быстрые действия</h3>
            <div class="space-y-2">
              <a href="#tasks" class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] transition-colors">
                <i class="ti ti-list-check text-[#FF4F00]"></i>
                <div><div class="text-sm font-medium">Управление задачами</div><div class="text-xs text-white/30">${d.totalTasks} задач в системе</div></div>
              </a>
              <a href="#users" class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] transition-colors">
                <i class="ti ti-users text-[#BF00FF]"></i>
                <div><div class="text-sm font-medium">Пользователи</div><div class="text-xs text-white/30">${d.totalUsers} аккаунтов</div></div>
              </a>
              <a href="#reports" class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] transition-colors">
                <i class="ti ti-alert-triangle text-[#EF4444]"></i>
                <div><div class="text-sm font-medium">Жалобы</div><div class="text-xs text-white/30">${d.totalReports || 0} открытых</div></div>
              </a>
              <a href="#notifications" class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] transition-colors">
                <i class="ti ti-send text-[#3B82F6]"></i>
                <div><div class="text-sm font-medium">Отправить рассылку</div><div class="text-xs text-white/30">Всем или конкретному</div></div>
              </a>
            </div>
          </div>
        </div>
      </div>
    `;
  } catch(e) { el.innerHTML = `<p class="text-red-400">Ошибка: ${esc(e.message)}</p>`; }
}

function statCard(icon, label, value, color) {
  return `<div class="glass p-4 flex items-center gap-4">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${color}15; border:1px solid ${color}30">
      <i class="ti ${icon}" style="color:${color}; font-size:22px"></i>
    </div>
    <div><div class="stat-num" style="color:${color}">${value}</div><div class="text-xs text-white/40 mt-0.5">${label}</div></div>
  </div>`;
}

// ─── MODERATION QUEUE ─────────────────────────────────────
async function renderModeration(el) {
  try {
    const d = await api('/tasks?status=moderation&limit=50');
    const tasks = d.tasks || [];

    // Update nav badge

async function modAction(taskId, newStatus) {
  const labels = { published: 'одобрить и опубликовать', hidden: 'отклонить и скрыть' };
  if (!confirm(`${labels[newStatus]} задачу #${taskId}?`)) return;
  try {
    if (newStatus === 'hidden') {
      await api(`/tasks/${taskId}/hide`, { method: 'PATCH', body: JSON.stringify({ hidden: 1 }) });
    } else {
      await api(`/tasks/${taskId}/status`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
    }
    toast(newStatus === 'published' ? 'Задача одобрена' : 'Задача отклонена', 'success');
    route();
  } catch(e) { toast('Ошибка: ' + e.message, 'error'); }
}

function debounceTasksSearch(v) { clearTimeout(tasksSearchTimer); tasksSearchTimer = setTimeout(() => { tasksFilter=v; tasksPage=1; renderTasks(document.getElementById('page-content')); }, 400); }

async function taskAction(id, status) {
  const labels = { published:'одобрить', hidden:'скрыть', moderation:'отправить на модерацию', cancelled:'отменить' };
  if (!confirm(`Вы уверены, что хотите ${labels[status]||status} задачу #${id}?`)) return;
  try {
    if (status==='hidden') await api(`/tasks/${id}/hide`, { method:'PATCH' });
    else await api(`/tasks/${id}/status`, { method:'PATCH', body:JSON.stringify({status}) });
    toast('Статус изменён', 'success'); route();
  } catch(e) { toast(e.message, 'error'); }
}

async function toggleHide(id, hide) {
  try { await api(`/tasks/${id}/hide`, { method:'PATCH', body:JSON.stringify({hidden: hide?1:0}) }); toast(hide?'Задача скрыта':'Задача показана','success'); route(); } catch(e) { toast(e.message,'error'); }
}

  document.getElementById('reports-open').classList.toggle('hidden', tab !== 'open');

  document.getElementById('tab-open').className = `btn ${tab==='open'?'btn-orange':'btn-ghost'}`;

}

      </div>

      <!-- Resolution Actions -->
      <div class="border-t border-white/[0.06] pt-4">
        <p class="text-xs text-white/40 mb-3 uppercase tracking-wider font-semibold">Решение</p>
        <div class="flex flex-wrap gap-2">
          ${isUser ? `
            <button onclick="reportAction(${r.id},'block','${r.target_id}')" class="btn btn-danger"><i class="ti ti-ban"></i>Заблокировать пользователя</button>
            <button onclick="reportAction(${r.id},'warn','${r.target_id}')" class="btn btn-ghost"><i class="ti ti-alert-triangle"></i>Предупредить</button>
          ` : ''}
          ${isTask ? `
            <button onclick="reportAction(${r.id},'hide_task','${r.target_id}')" class="btn btn-danger"><i class="ti ti-eye-off"></i>Скрыть задачу</button>
            <button onclick="reportAction(${r.id},'cancel_task','${r.target_id}')" class="btn btn-danger"><i class="ti ti-x"></i>Отменить задачу</button>
          ` : ''}
          <button onclick="reportAction(${r.id},'dismiss','')" class="btn btn-ghost"><i class="ti ti-x"></i>Отклонить жалобу</button>
        </div>
      </div>
    </div>
  `;
}

async function reportAction(reportId, action, targetId) {
  const labels = {
    block: 'заблокировать пользователя',
    warn: 'отправить предупреждение',
    hide_task: 'скрыть задачу',
    cancel_task: 'отменить задачу',
    dismiss: 'отклонить жалобу'
  };
  if (!confirm(`Вы уверены: ${labels[action]}?`)) return;

  try {
    // Execute the action
    if (action === 'block' && targetId) {
      await api(`/users/${targetId}/block`, { method: 'PATCH', body: JSON.stringify({ blocked: 1 }) });
    } else if (action === 'hide_task' && targetId) {
      await api(`/tasks/${targetId}/hide`, { method: 'PATCH', body: JSON.stringify({ hidden: 1 }) });
    } else if (action === 'cancel_task' && targetId) {
      await api(`/tasks/${targetId}/status`, { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
    } else if (action === 'warn' && targetId) {
      await api('/notifications/broadcast', { method: 'POST', body: JSON.stringify({ message: 'Вам выдано предупреждение от модерации. Повторные нарушения приведут к блокировке.', target: 'user', userId: parseInt(targetId) }) });
    }
    // Close the report
    await api(`/reports/${reportId}/resolve`, { method: 'PATCH' });
    toast('Жалоба обработана', 'success');
    // Refresh
    route();
  } catch(e) {
    toast('Ошибка: ' + e.message, 'error');
  }
}

async function renderNotifications(el) {
  el.innerHTML = `
    <div class="grid lg:grid-cols-2 gap-6">
      <div class="glass p-6">
        <h3 class="font-jakarta font-bold mb-4 flex items-center gap-2"><i class="ti ti-send text-[#FF4F00]"></i>Отправить рассылку</h3>
        <div class="space-y-4">
          <div><label class="block text-xs font-semibold text-white/50 mb-1 uppercase tracking-wider">Сообщение</label>
            <textarea id="broadcast-msg" class="input" rows="3" placeholder="Текст уведомления..."></textarea></div>
          <div><label class="block text-xs font-semibold text-white/50 mb-1 uppercase tracking-wider">Получатель</label>
            <select id="broadcast-target" class="input"><option value="all">Всем пользователям</option><option value="clients">Только заказчикам</option><option value="performers">Только исполнителям</option></select></div>
          <button onclick="sendBroadcast()" class="btn btn-orange w-full"><i class="ti ti-send"></i>Отправить</button>
        </div>
      </div>
      <div class="glass p-6">
        <h3 class="font-jakarta font-bold mb-4 flex items-center gap-2"><i class="ti ti-history text-[#BF00FF]"></i>Последние рассылки</h3>
        <div id="broadcast-history" class="space-y-2"><p class="text-white/30 text-sm">Загрузка...</p></div>
      </div>
    </div>
  `;
  try {
    const d = await api('/notifications?page=1&limit=20');
    const hist = document.getElementById('broadcast-history');
    const system = (d.notifications||[]).filter(n => n.type==='system');
    hist.innerHTML = system.length ? system.map(n => `
      <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.05]">
        <p class="text-sm">${esc(n.payload?.message||'')}</p>
        <p class="text-xs text-white/25 mt-1">${fmtDate(n.created_at)}</p>
      </div>
    `).join('') : '<p class="text-white/30 text-sm">Нет рассылок</p>';
  } catch {}
}

async function sendBroadcast() {
  const msg = document.getElementById('broadcast-msg').value;
  const target = document.getElementById('broadcast-target').value;
  if (!msg) return toast('Введите сообщение', 'error');
  await confirmAction(`Отправить уведомление: ${target==='all'?'всем':'группе'}?`, async () => {
    await api('/notifications/broadcast', { method:'POST', body:JSON.stringify({ message:msg, target }) });
  });
}

// ─── Pagination ───────────────────────────────────────────
function pagination(current, total, onclick) {
  if (!total || total <= 1) return '';
  let btns = '';
  for (let i = 1; i <= Math.min(total, 7); i++) {
    btns += `<button onclick="${onclick.replace(')',`,${i})`)}" class="btn ${i===current?'btn-orange':'btn-ghost'} btn-sm">${i}</button>`;
  }
  if (total > 7) btns += `<span class="text-white/30 px-2">...${total}</span>`;
  return `<div class="flex gap-1 mt-4 justify-center">${btns}</div>`;
}
